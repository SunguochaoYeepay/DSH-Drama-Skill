name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 安装 Windows 媒体依赖
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      # 只有 bailian-cli 一个运行时依赖，且确定性测试用不到它；装它是为了让
      # src/runtime-paths.mjs 的仓内路径分支与时保持一致。
      - run: npm install --ignore-scripts

      # 确定性测试：不联网、不烧卡、不需要 ComfyUI。
      # 少数用例要用 ffmpeg 现造素材 —— ubuntu runner 自带。
      - run: npm test

      - name: 资产 CLI E2E
        run: npm run test:e2e

      - name: 视频合成 E2E
        run: npm run test:e2e:video

      - name: 契约自检
        run: node cli/doctor.mjs || true
